<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Moon Phase</title>
<meta name="theme-color" content="#050810">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#E09DFF;
  --w80:rgba(255,255,255,.8);
  --w50:rgba(255,255,255,.5);
  --w20:rgba(255,255,255,.2);
  --w10:rgba(255,255,255,.1);
  --w06:rgba(255,255,255,.06);
}
html,body{height:100%;font-family:'Jost',system-ui,sans-serif;background:#050810;color:#fff;overflow-x:hidden}

/* ── Background ── */
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 80% 55% at 15% 8%, rgba(18,45,105,.65) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 88% 88%, rgba(55,18,105,.45) 0%,transparent 60%),
    radial-gradient(ellipse 100% 80% at 50% 45%, rgba(4,7,20,1) 0%,#050810 100%);
}
.stars{position:fixed;inset:0;z-index:1;pointer-events:none}
.stars::before{
  content:'';position:absolute;inset:0;
  background-image:
    radial-gradient(1px 1px at 7% 17%,#fff 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 21% 6%,#fff 0%,transparent 100%),
    radial-gradient(1px 1px at 37% 31%,rgba(255,255,255,.8) 0%,transparent 100%),
    radial-gradient(1px 1px at 51% 11%,rgba(255,255,255,.7) 0%,transparent 100%),
    radial-gradient(1px 1px at 66% 25%,#fff 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 81% 8%,rgba(255,255,255,.9) 0%,transparent 100%),
    radial-gradient(1px 1px at 12% 51%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 28% 67%,rgba(255,255,255,.8) 0%,transparent 100%),
    radial-gradient(1px 1px at 56% 57%,rgba(255,255,255,.6) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 72% 71%,rgba(255,255,255,.9) 0%,transparent 100%),
    radial-gradient(1px 1px at 88% 47%,rgba(255,255,255,.7) 0%,transparent 100%),
    radial-gradient(1px 1px at 3% 81%,rgba(255,255,255,.8) 0%,transparent 100%),
    radial-gradient(1px 1px at 42% 87%,rgba(255,255,255,.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 92% 87%,rgba(255,255,255,.7) 0%,transparent 100%),
    radial-gradient(1px 1px at 32% 42%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 61% 38%,rgba(200,180,255,.6) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 77% 32%,#fff 0%,transparent 100%),
    radial-gradient(1px 1px at 16% 26%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 46% 2%,rgba(255,255,255,.7) 0%,transparent 100%),
    radial-gradient(1px 1px at 85% 61%,rgba(255,255,255,.7) 0%,transparent 100%),
    radial-gradient(1px 1px at 1% 44%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 54% 77%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 95% 21%,rgba(255,255,255,.8) 0%,transparent 100%),
    radial-gradient(1px 1px at 70% 14%,rgba(210,200,255,.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 23% 91%,rgba(255,255,255,.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 48% 58%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 9% 33%,rgba(255,255,255,.6) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 63% 5%,rgba(255,255,255,.7) 0%,transparent 100%),
    radial-gradient(1px 1px at 35% 78%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 79% 52%,rgba(255,255,255,.6) 0%,transparent 100%);
}
.stars::after{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 45% 25% at 10% 20%,rgba(28,65,140,.2) 0%,transparent 70%),
    radial-gradient(ellipse 35% 35% at 90% 75%,rgba(85,28,145,.15) 0%,transparent 70%),
    radial-gradient(ellipse 55% 15% at 50% 92%,rgba(18,45,125,.12) 0%,transparent 70%);
}

/* ── App ── */
#app{
  position:relative;z-index:10;
  width:min(390px,100vw);min-height:100dvh;
  margin:0 auto;display:flex;flex-direction:column;
  padding-bottom:36px;
}

/* ── Loading ── */
#loading{
  position:fixed;inset:0;z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  background:#050810;transition:opacity .5s ease;
}
#loading.fade{opacity:0;pointer-events:none}
.ld-moon{
  width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#D8D4CC,#8A8680,#3A3630);
  animation:ldpulse 1.6s ease-in-out infinite;
}
@keyframes ldpulse{0%,100%{opacity:.35;transform:scale(.88)}50%{opacity:1;transform:scale(1)}}
.ld-text{font-size:14px;color:var(--w50);letter-spacing:.08em}

/* ── Status bar ── */
#statusBar{display:none}

/* ── Topbar ── */
#topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 22px 0;
}
.top-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--w80);cursor:pointer;border-radius:50%;background:transparent;border:none}
.nav-pills{
  display:flex;background:rgba(255,255,255,.08);
  border:1px solid var(--w10);border-radius:999px;
  padding:3px;gap:1px;backdrop-filter:blur(12px);
}
.nav-pill{
  font-family:'Jost',sans-serif;font-size:14px;font-weight:500;
  padding:5px 18px;border-radius:999px;cursor:pointer;
  color:var(--w50);border:none;background:none;transition:all .2s;letter-spacing:.02em;
}
.nav-pill.active{background:#fff;color:#000}
.nav-pill.soon{opacity:.45;cursor:default}

/* ── Location banner ── */
#locBanner{
  display:none;margin:8px 22px 0;padding:8px 14px;
  background:rgba(224,157,255,.08);border:1px solid rgba(224,157,255,.2);
  border-radius:10px;font-size:12px;color:var(--accent);
  letter-spacing:.02em;cursor:pointer;text-align:center;
  transition:opacity .3s;
}
#locBanner.show{display:block}

/* ── Date ── */
#dateSection{text-align:center;padding:16px 22px 0}
#dateMain{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1}
#dateSub{font-size:14px;font-weight:400;color:var(--w50);margin-top:3px;letter-spacing:.04em}

/* ── Moon ── */
#moonSection{
  position:relative;display:flex;align-items:center;justify-content:center;
  padding:14px 0 6px;flex-shrink:0;
}
.orbit{position:absolute;border-radius:50%;border:1px dashed rgba(255,255,255,.14);pointer-events:none}
.orb1{width:298px;height:298px}
.orb2{width:360px;height:360px;border-color:rgba(255,255,255,.07)}
.planet{position:absolute;font-size:17px;opacity:.7;user-select:none}
.pl-tl{top:46px;left:calc(50% - 82px)}
.pl-br{bottom:46px;right:calc(50% - 82px)}
#moonSvg{
  filter:
    drop-shadow(0 0 28px rgba(210,200,190,.2))
    drop-shadow(0 0 60px rgba(210,200,190,.09));
  position:relative;z-index:5;
}

/* ── Phase text ── */
#phaseSection{text-align:center;padding:10px 22px 0}
#phaseName{font-size:24px;font-weight:700;letter-spacing:.01em}
#phaseSub{font-size:13px;color:var(--w50);margin-top:4px;letter-spacing:.06em}
.ps-sign{color:var(--accent)}
.pdots{display:flex;justify-content:center;gap:7px;margin-top:10px}
.pd{width:7px;height:7px;border-radius:50%;background:var(--w20);transition:background .3s}
.pd.on{background:var(--w80)}

/* ── Countdown ── */
#countdown{
  margin:14px 16px 0;
  padding:13px 20px;
  background:rgba(224,157,255,.09);
  border:1px solid rgba(224,157,255,.2);
  border-radius:16px;
  display:flex;flex-direction:column;
  backdrop-filter:blur(12px);
}
#countdown.tonight{
  background:rgba(224,157,255,.16);
  border-color:rgba(224,157,255,.4);
}
.cd-row{display:flex;align-items:center;justify-content:space-between}
.cd-label{font-size:12px;color:var(--w50);text-transform:uppercase;letter-spacing:.1em}
.cd-value{font-size:22px;font-weight:700;color:var(--accent);letter-spacing:.01em;line-height:1.15}
.cd-date{font-size:12px;color:var(--w50);margin-top:2px;letter-spacing:.04em}
.cd-icon{font-size:24px;opacity:.8}

/* ── Mini Full Moon Window ── */
.mw-strip{
  display:flex;justify-content:space-between;
  margin-top:12px;padding-top:11px;
  border-top:1px solid rgba(255,255,255,.1);
}
.mw-day{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.mw-date{font-size:11px;color:var(--w50);letter-spacing:.03em}
.mw-icon{font-size:20px;line-height:1.2}
.mw-pct{font-size:11px;color:var(--w50)}
.mw-day.peak .mw-date{color:var(--accent);font-weight:600}
.mw-day.peak .mw-icon{font-size:26px}
.mw-day.peak .mw-pct{color:var(--accent);font-weight:600}
.mw-day.today .mw-date{color:#fff;font-weight:600}

/* ── Cards ── */
#cards{padding:10px 16px 0;display:flex;flex-direction:column;gap:10px}
.card{
  background:rgba(255,255,255,.07);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.11);border-radius:20px;padding:16px 20px;
}

/* Times card */
.times-card{display:flex;justify-content:space-around;align-items:center}
.tc{text-align:center;flex:1}
.tc-lbl{font-size:11px;color:var(--w50);text-transform:uppercase;letter-spacing:.12em;margin-bottom:5px}
.tc-val{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tc-val.ac{color:var(--accent)}
.tc-val.wh{color:rgba(255,255,255,.85);font-size:22px}
.tc-sep{width:1px;height:36px;background:var(--w10)}

/* Horizon card */
.hz-row{display:flex;align-items:center;justify-content:center;gap:8px}
.hzdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.hzdot.up{background:#4ABFB0;animation:blink 2.4s ease-in-out infinite}
.hzdot.dn{background:#B06060}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hztext{font-size:13px;color:var(--w80);letter-spacing:.02em}

/* Info card */
.ir{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--w06)}
.ir:first-child{padding-top:0}
.ir:last-child{border-bottom:none;padding-bottom:0}
.ilbl{font-size:11px;color:var(--w50);text-transform:uppercase;letter-spacing:.1em}
.ival{font-size:14px;font-weight:500}
.ival.ac{color:var(--accent)}

/* ── View Container — CSS grid overlay so both views share the same space ── */
#viewContainer{
  display:grid;
}
#viewContainer > div{
  grid-area:1/1;
  width:100%;
  min-height:1px;
}

/* ── Month View ── */
#monthView{display:none;padding:0 10px 36px}
#mvNav{
  display:flex;align-items:center;justify-content:space-between;
  height:52px;padding:0 4px;
}
.mv-title-group{display:flex;flex-direction:column;align-items:center;gap:2px}
#mvTitle{font-size:18px;font-weight:700;letter-spacing:.01em}
#mvTodayBtn{
  display:none;font-family:'Jost',sans-serif;font-size:11px;font-weight:500;
  color:var(--accent);background:none;border:none;cursor:pointer;
  letter-spacing:.06em;text-transform:uppercase;padding:0;
}
.mv-arr{
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;color:var(--accent);font-size:22px;
  cursor:pointer;border-radius:50%;transition:background .15s;
}
.mv-arr:active{background:rgba(224,157,255,.15)}
#mvDow{
  display:grid;grid-template-columns:repeat(7,1fr);
  text-align:center;margin-bottom:4px;
}
#mvDow span{font-size:11px;color:#7A7A9D;font-weight:500;text-transform:uppercase;letter-spacing:.06em;padding:4px 0}
#mvGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mvc{
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:5px 2px 6px;border-radius:10px;min-height:58px;position:relative;
}
.mvc.full{background:rgba(224,157,255,.10)}
.mvc-num{
  font-size:13px;font-weight:500;color:var(--w50);
  width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;margin-bottom:2px;line-height:1;
}
.mvc.today .mvc-num{background:var(--accent);color:#120820;font-weight:700}
.mvc-emoji{font-size:20px;line-height:1}
.mvc.full .mvc-emoji{font-size:24px;filter:drop-shadow(0 0 5px rgba(224,157,255,.7))}

/* ── Shared Element Transition ── */
.flying-moon{
  position:fixed;
  border-radius:50%;
  background:url('./moon.jpg') center/cover;
  box-shadow:0 0 28px rgba(210,200,190,.2),0 0 60px rgba(210,200,190,.09);
  z-index:200;
  pointer-events:none;
  will-change:left,top,width,height;
  transition:
    left   .52s cubic-bezier(.34,1.1,.64,1),
    top    .52s cubic-bezier(.34,1.1,.64,1),
    width  .45s cubic-bezier(.34,1.1,.64,1),
    height .45s cubic-bezier(.34,1.1,.64,1);
}

/* ── Section stagger-rise (Month → Today) ── */
@keyframes stagger-rise {
  from { opacity:0; transform:translateY(12px); }
  to   { opacity:1; transform:translateY(0); }
}
.sr { animation: stagger-rise .28s ease both; }

/* ── Calendar grid entrance (Today → Month) ── */
@keyframes grid-up {
  from { transform:translateY(10px); }
  to   { transform:translateY(0); }
}
.mvg-enter { animation: grid-up .35s cubic-bezier(.25,.46,.45,.94) .1s both; }

/* ── Location button spinner ── */
@keyframes loc-spin { to { transform:rotate(360deg); } }
.loc-loading::before {
  content:'';position:absolute;inset:3px;border-radius:50%;
  border:1.5px solid transparent;
  border-top-color:var(--accent);
  animation:loc-spin .75s linear infinite;
}

/* ── Bell active dot ── */
.top-icon{position:relative}
.bell-active::after{
  content:'';position:absolute;top:6px;right:6px;
  width:7px;height:7px;border-radius:50%;
  background:var(--accent);border:1.5px solid #050810;
}

/* ── Day nav arrows ── */
.day-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(224,157,255,.07);
  border:1px solid rgba(224,157,255,.18);
  color:var(--accent);font-size:22px;line-height:1;
  cursor:pointer;z-index:10;
  transition:background .15s,opacity .15s,transform .15s;
  opacity:.65;user-select:none;-webkit-tap-highlight-color:transparent;
}
.day-nav:hover{opacity:1}
.day-nav:active{background:rgba(224,157,255,.22);opacity:1;transform:translateY(-50%) scale(.92)}
#dayPrev{left:16px}
#dayNext{right:16px}

/* ── Scrub date banner ── */
#scrubBanner{
  display:none;margin:6px 22px 0;padding:7px 16px;
  background:rgba(224,157,255,.08);border:1px solid rgba(224,157,255,.2);
  border-radius:10px;font-size:12px;color:var(--accent);
  letter-spacing:.02em;align-items:center;justify-content:center;gap:10px;
}
#scrubBanner.show{display:flex}
#scrubDateLabel{flex:1;text-align:center}
#scrubTodayBtn{
  font-family:'Jost',sans-serif;font-size:12px;font-weight:600;
  color:var(--accent);background:none;
  border:1px solid rgba(224,157,255,.3);border-radius:8px;
  padding:3px 10px;cursor:pointer;letter-spacing:.03em;flex-shrink:0;
}

/* ── Location Sheet ── */
#locOverlay{
  display:none;position:fixed;inset:0;z-index:300;
  background:rgba(5,8,16,0);backdrop-filter:blur(0px);
  align-items:flex-end;justify-content:center;
  transition:background .32s ease,backdrop-filter .32s ease;
}
#locOverlay.open{background:rgba(5,8,16,.6);backdrop-filter:blur(4px)}
#locSheet{
  width:min(390px,100vw);
  background:rgba(18,14,32,.97);
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px 24px 0 0;
  padding:12px 24px 44px;
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.25,.46,.45,.94);
  max-height:80vh;overflow-y:auto;
}
#locOverlay.open #locSheet{transform:translateY(0)}
.ls-gps{
  width:100%;font-family:'Jost',sans-serif;font-size:15px;font-weight:600;
  padding:13px;border-radius:14px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;gap:8px;
  background:rgba(224,157,255,.13);border:1px solid rgba(224,157,255,.28);
  color:var(--accent);transition:opacity .2s;margin-bottom:16px;
}
.ls-gps:active{opacity:.75}
.ls-or{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
  font-size:11px;color:var(--w50);letter-spacing:.08em;text-transform:uppercase;
}
.ls-or::before,.ls-or::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.1)}
.ls-search-wrap{position:relative;margin-bottom:6px}
#locSearch{
  width:100%;font-family:'Jost',sans-serif;font-size:15px;
  padding:12px 16px 12px 42px;border-radius:12px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  color:#fff;outline:none;transition:border-color .2s;
}
#locSearch::placeholder{color:var(--w50)}
#locSearch:focus{border-color:rgba(224,157,255,.4)}
.ls-search-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--w50);pointer-events:none;
}
#locResults{margin-top:4px}
.ls-result{
  padding:11px 12px;border-radius:12px;cursor:pointer;
  transition:background .15s;border-bottom:1px solid rgba(255,255,255,.05);
}
.ls-result:last-child{border-bottom:none}
.ls-result:active{background:rgba(255,255,255,.08)}
.ls-result-name{font-size:15px;font-weight:500;color:#fff}
.ls-result-sub{font-size:12px;color:var(--w50);margin-top:2px}
.ls-msg{font-size:13px;color:var(--w50);text-align:center;padding:16px 0}

/* ── Notification Sheet ── */
#notifOverlay{
  display:none;position:fixed;inset:0;z-index:300;
  background:rgba(5,8,16,0);backdrop-filter:blur(0px);
  align-items:flex-end;justify-content:center;
  transition:background .32s ease,backdrop-filter .32s ease;
}
#notifOverlay.open{background:rgba(5,8,16,.6);backdrop-filter:blur(4px)}
#notifSheet{
  width:min(390px,100vw);
  background:rgba(18,14,32,.97);
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px 24px 0 0;
  padding:12px 24px 44px;
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.25,.46,.45,.94);
}
#notifOverlay.open #notifSheet{transform:translateY(0)}
.ns-handle{
  width:36px;height:4px;border-radius:2px;
  background:rgba(255,255,255,.2);margin:0 auto 20px;
}
.ns-title{font-size:18px;font-weight:700;margin-bottom:4px}
.ns-next{font-size:13px;color:var(--w50);margin-bottom:20px;letter-spacing:.03em}
.ns-label{font-size:11px;color:var(--w50);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.ns-presets{display:flex;gap:8px;margin-bottom:24px}
.ns-preset{
  flex:1;font-family:'Jost',sans-serif;font-size:13px;font-weight:500;
  padding:9px 4px;border-radius:12px;cursor:pointer;letter-spacing:.02em;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  color:var(--w50);transition:all .2s;
}
.ns-preset.active{
  background:rgba(224,157,255,.18);
  border-color:rgba(224,157,255,.4);
  color:var(--accent);
}
.ns-toggle{
  width:100%;font-family:'Jost',sans-serif;font-size:15px;font-weight:600;
  padding:14px;border-radius:14px;cursor:pointer;letter-spacing:.02em;
  background:var(--accent);border:none;color:#120820;
  transition:opacity .2s;margin-bottom:12px;display:block;
}
.ns-toggle:active{opacity:.8}
.ns-toggle.cancel{background:rgba(255,255,255,.1);color:var(--w80)}
.ns-close-btn{
  width:100%;font-family:'Jost',sans-serif;font-size:14px;
  padding:10px;border-radius:14px;cursor:pointer;
  background:none;border:none;color:var(--w50);display:block;
}

</style>
</head>
<body>

<div class="stars"></div>

<!-- Loading -->
<div id="loading">
  <div class="ld-moon"></div>
  <div class="ld-text">reading the moon</div>
</div>

<div id="app">

  <div id="statusBar"></div>

  <!-- Nav -->
  <div id="topbar">

    </div>
    <button class="top-icon" id="bellBtn" onclick="openNotifSheet()" title="Full moon reminder">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </button>
  </div>

  <!-- Location banner -->
  <div id="locBanner" onclick="requestLocation()">
    📍 Using default location · Tap to use yours
  </div>

  <!-- Scrub date banner (visible when not viewing today) -->
  <div id="scrubBanner">
    <span id="scrubDateLabel"></span>
    <button id="scrubTodayBtn" onclick="resetToToday()">↩ Today</button>
  </div>

  <!-- ── View Container (CSS grid overlay — both views share the same space) ── -->
  <div id="viewContainer">

  <!-- ── Today View ── -->
  <div id="todayView">

  <!-- Date -->
  <div id="dateSection">
    <div id="dateMain">—</div>
    <div id="dateSub">—</div>
  </div>

  <!-- Moon SVG -->
  <div id="moonSection">
    <button class="day-nav" id="dayPrev" onclick="scrubDay(-1)">‹</button>
    <button class="day-nav" id="dayNext" onclick="scrubDay(1)">›</button>
    <div class="orbit orb2"></div>
    <div class="orbit orb1"></div>

    <svg id="moonSvg" width="220" height="220" viewBox="0 0 240 240">
      <defs>
        <clipPath id="mc"><circle cx="120" cy="120" r="115"/></clipPath>
      </defs>
      <image id="moonImg"
        href="./moon.jpg"
        x="0" y="0" width="240" height="240"
        clip-path="url(#mc)"
        preserveAspectRatio="xMidYMid slice"/>
      <path id="moonShadow" d="" fill="rgba(3,5,14,.94)" clip-path="url(#mc)"/>
      <circle cx="120" cy="120" r="115" fill="none" stroke="rgba(255,255,255,.055)" stroke-width="1.5"/>

  </div>

  <!-- Phase info -->
  <div id="phaseSection">
    <div id="phaseName">—</div>
    <div id="phaseSub">—</div>
    <div class="pdots" id="pdots"></div>
  </div>

  <!-- Countdown + Mini Window -->
  <div id="countdown">
    <div class="cd-row">
      <div>
        <div class="cd-label" id="cdLabel">Next full moon</div>
        <div class="cd-value" id="cdValue">—</div>
        <div class="cd-date" id="cdDate"></div>

  <!-- Cards -->
  <div id="cards">

    <div class="card times-card">
      <div class="tc">
        <div class="tc-lbl">Moonrise</div>
        <div class="tc-val ac" id="riseEl">—</div>
      </div>
      <div class="tc-sep"></div>
      <div class="tc">
        <div class="tc-lbl">Illuminated</div>
        <div class="tc-val wh" id="illumEl">—</div>
      </div>
      <div class="tc-sep"></div>
      <div class="tc">
        <div class="tc-lbl">Moonset</div>
        <div class="tc-val ac" id="setEl">—</div>

    <div class="card" style="padding:12px 20px">
      <div class="hz-row">
        <div class="hzdot" id="hzDot"></div>
        <span class="hztext" id="hzText">—</span>

    </div>

    <div class="card">
      <div class="ir">
        <span class="ilbl">Lunar day</span>
        <span class="ival" id="lunarDayEl">—</span>
      </div>
      <div class="ir">
        <span class="ilbl">Distance</span>
        <span class="ival" id="distEl">—</span>
      </div>
    </div>

  </div><!-- /cards -->
  </div><!-- /todayView -->

  <!-- ── Month View ── -->
  <div id="monthView">
    <div id="mvNav">
      <button class="mv-arr" onclick="shiftMonth(-1)">‹</button>
      <div class="mv-title-group">
        <span id="mvTitle"></span>
        <button id="mvTodayBtn" onclick="goToToday()">↩ Today</button>
      </div>
      <button class="mv-arr" onclick="shiftMonth(1)">›</button>
    </div>
    <div id="mvDow">
      <span>Sun</span><span>Mon</span><span>Tue</span>
      <span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>
    <div id="mvGrid"></div>
  </div>

  </div><!-- /viewContainer -->

</div>

<!-- Location Sheet -->
<div id="locOverlay" onclick="if(event.target===this)closeLocSheet()">
  <div id="locSheet">
    <div class="ns-handle"></div>
    <div class="ns-title">Location</div>
    <button class="ls-gps" onclick="useGPS()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
        <circle cx="12" cy="9" r="2.5"/>
      </svg>
      Use my location
    </button>
    <div class="ls-or">or</div>
    <div class="ls-search-wrap">
      <svg class="ls-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="locSearch" type="text" placeholder="Search city..." oninput="searchCity(this.value)" autocomplete="off" spellcheck="false">
    </div>
    <div id="locResults"></div>
  </div>
</div>

<!-- Notification Sheet -->
<div id="notifOverlay" onclick="if(event.target===this)closeNotifSheet()">
  <div id="notifSheet">
    <div class="ns-handle"></div>
    <div class="ns-title">Full Moon Reminder</div>
    <div class="ns-next" id="nsNextFull"></div>
    <div class="ns-label">Remind me</div>
    <div class="ns-presets">
      <button class="ns-preset active" data-days="3" onclick="selectPreset(3)">3 days before</button>
      <button class="ns-preset"        data-days="1" onclick="selectPreset(1)">1 day before</button>
      <button class="ns-preset"        data-days="0" onclick="selectPreset(0)">That night</button>
    </div>
    <button class="ns-toggle" id="nsToggle" onclick="toggleReminder()">Enable Reminder</button>
    <button class="ns-close-btn" onclick="closeNotifSheet()">Cancel</button>
  </div>
</div>

<script>
// ─── Constants ────────────────────────────────────────────────────────
const DEFAULT = {lat:32.0853, lng:34.7818, city:'Tel Aviv'};

const PHASE_INFO = {
  'New Moon':        'The cycle begins anew. A powerful moment for intention-setting, new starts, and quiet reflection.',
  'Waxing Crescent': 'The moon grows stronger. Energy builds — a good time to nurture plans and plant seeds of intention.',
  'First Quarter':   'A turning point in the cycle. Push through resistance and take decisive steps toward your goals.',
  'Waxing Gibbous':  'Almost there. Refine and perfect what you have started — full moon and peak energy approach.',
  'Full Moon':       'Peak energy and illumination. Emotions run high, creativity peaks, insights arrive with clarity.',
  'Waning Gibbous':  'Share what you have gained. A time for gratitude, generosity, and passing wisdom forward.',
  'Last Quarter':    'Release what no longer serves you. Let go, forgive, and clear space for what comes next.',
  'Waning Crescent': 'Rest and restore. The cycle nears its end — surrender, reflect, and prepare for renewal.',
};

let loc = null, usingDefault = false;
let reminder = JSON.parse(localStorage.getItem('moonReminder') || 'null');
let selectedDays = reminder ? reminder.daysBefore : 3;
let viewDate = new Date(); viewDate.setHours(12,0,0,0);

// ─── Helpers ──────────────────────────────────────────────────────────
function getMoonSign(date) {
  const d = (date - new Date('2000-01-01T12:00:00Z')) / 86400000;
  const L = (218.316 + 13.176396 * d) % 360;
  const M = (134.963 + 13.064993 * d) * Math.PI / 180;
  const lon = ((L + 6.289 * Math.sin(M)) % 360 + 360) % 360;
  const names   = ['Aries','Taurus','Gemini','Cancer','Leo','Virgo',
                   'Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
  const symbols = ['♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓']
                  .map(s => s + '︎');
  const i = Math.floor(lon / 30);
  return { name: names[i], symbol: symbols[i] };
}

function getPhaseName(p) {
  if (p < .0625 || p >= .9375) return 'New Moon';
  if (p < .1875) return 'Waxing Crescent';
  if (p < .3125) return 'First Quarter';
  if (p < .4375) return 'Waxing Gibbous';
  if (p < .5625) return 'Full Moon';
  if (p < .6875) return 'Waning Gibbous';
  if (p < .8125) return 'Last Quarter';
  return 'Waning Crescent';
}

function phaseRoman(p) {
  return ['I','II','III','IV','V','VI','VII','VIII'][Math.round(p * 8) % 8];
}

function shadowPath(frac, waxing) {
  const R=115, cx=120, cy=120;
  if (frac >= .999) return '';
  if (frac <= .001) return `M${cx-R} ${cy} A${R} ${R} 0 1 0 ${cx+R} ${cy} A${R} ${R} 0 1 0 ${cx-R} ${cy}Z`;
  const tx = R * Math.abs(1 - 2*frac);
  if (waxing) {
    if (frac < .5) return `M${cx} ${cy-R} A${R} ${R} 0 0 0 ${cx} ${cy+R} A${tx} ${R} 0 0 0 ${cx} ${cy-R}Z`;
    else          return `M${cx} ${cy-R} A${R} ${R} 0 0 0 ${cx} ${cy+R} A${tx} ${R} 0 0 1 ${cx} ${cy-R}Z`;
  } else {
    if (frac > .5) return `M${cx} ${cy-R} A${R} ${R} 0 0 1 ${cx} ${cy+R} A${tx} ${R} 0 0 0 ${cx} ${cy-R}Z`;
    else           return `M${cx} ${cy-R} A${R} ${R} 0 0 1 ${cx} ${cy+R} A${tx} ${R} 0 0 1 ${cx} ${cy-R}Z`;
  }
}

function fmtTime(d) {
  if (!d || isNaN(+d)) return 'N/A';
  return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
}

function fmtPct(f) {
  const p = f * 100;
  if (p < .1) return '0%';
  if (p > 99.9) return '100%';
  return p.toFixed(1) + '%';
}

function fmtDistKm(km) {
  return Math.round(km).toLocaleString() + ' km';
}

function fmtDateLong(d) {
  return d.toLocaleDateString([],{month:'long',day:'numeric',year:'numeric'});
}
function fmtDateShort(d) {
  return d.toLocaleDateString([],{month:'short',day:'numeric'});
}

function isAbove(rise, set) {
  const now = Date.now();
  if (!rise && !set) return false;
  if (!rise) return now < +set;
  if (!set)  return now > +rise;
  if (+rise < +set) return now >= +rise && now < +set;
  return now < +set || now >= +rise;
}

function moonEmoji(phase) {
  if (phase < 0.0625 || phase >= 0.9375) return '🌑';
  if (phase < 0.1875) return '🌒';
  if (phase < 0.3125) return '🌓';
  if (phase < 0.4375) return '🌔';
  if (phase < 0.5625) return '🌕';
  if (phase < 0.6875) return '🌖';
  if (phase < 0.8125) return '🌗';
  return '🌘';
}

function buildMiniWindow(nf) {
  const strip = document.getElementById('mwStrip');
  if (!strip || !nf) return;
  strip.innerHTML = '';
  const today = new Date(); today.setHours(0,0,0,0);
  for (let i = -2; i <= 2; i++) {
    const d = new Date(nf);
    d.setDate(nf.getDate() + i);
    d.setHours(12,0,0,0);
    const ill = SunCalc.getMoonIllumination(d);
    const isPeak  = (i === 0);
    const isToday = (d.getTime() === today.getTime());
    const div = document.createElement('div');
    div.className = 'mw-day' + (isPeak ? ' peak' : '') + (isToday ? ' today' : '');
    div.innerHTML =
      `<div class="mw-date">${d.toLocaleDateString([],{day:'numeric',month:'short'})}</div>` +
      `<div class="mw-icon">${moonEmoji(ill.phase)}</div>` +
      `<div class="mw-pct">${Math.round(ill.fraction*100)}%</div>`;
    strip.appendChild(div);
  }
}

function lastFullMoon(from) {
  const base = from ? new Date(from) : new Date(); base.setHours(12,0,0,0);
  let prev = SunCalc.getMoonIllumination(base).fraction;
  for (let i = 1; i <= 35; i++) {
    const d = new Date(base); d.setDate(base.getDate() - i); d.setHours(12,0,0,0);
    const f = SunCalc.getMoonIllumination(d).fraction;
    if (prev > f && prev > 0.993) {
      const peak = new Date(base); peak.setDate(base.getDate() - (i - 1));
      return peak;
    }
    prev = f;
  }
  return null;
}

function nextFullMoon(from) {
  const base = from ? new Date(from) : new Date(); base.setHours(12,0,0,0);
  let prev = SunCalc.getMoonIllumination(base).fraction;
  for (let i=1; i<=35; i++) {
    const d = new Date(base); d.setDate(base.getDate()+i);
    const f = SunCalc.getMoonIllumination(d).fraction;
    if (prev > f && prev > .993) {
      const peak = new Date(base); peak.setDate(base.getDate()+i-1);
      return peak;
    }
    prev = f;
  }
  return null;
}

// ─── Location Sheet ───────────────────────────────────────────────────
let locSearchTimer = null;

function openLocSheet() {
  const input = document.getElementById('locSearch');
  input.value = '';
  document.getElementById('locResults').innerHTML = '';
  const overlay = document.getElementById('locOverlay');
  overlay.style.display = 'flex';
  requestAnimationFrame(() => overlay.classList.add('open'));
  setTimeout(() => input.focus(), 340);
}

function closeLocSheet() {
  const overlay = document.getElementById('locOverlay');
  overlay.classList.remove('open');
  setTimeout(() => { overlay.style.display = 'none'; }, 320);
}

function useGPS() {
  closeLocSheet();
  requestLocation();
}

function searchCity(q) {
  clearTimeout(locSearchTimer);
  const results = document.getElementById('locResults');
  if (q.length < 2) { results.innerHTML = ''; return; }
  locSearchTimer = setTimeout(() => doSearch(q), 350);
}

async function doSearch(q) {
  const results = document.getElementById('locResults');
  results.innerHTML = '<div class="ls-msg">Searching…</div>';
  try {
    const r = await fetch(
      `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en&format=json`
    );
    const d = await r.json();
    if (!d.results || d.results.length === 0) {
      results.innerHTML = '<div class="ls-msg">No cities found</div>';
      return;
    }
    results.innerHTML = d.results.map(c => {
      const sub = [c.admin1, c.country].filter(Boolean).join(', ');
      const safeName = c.name.replace(/'/g, "\\'");
      return `<div class="ls-result" onclick="selectCity('${safeName}',${c.latitude},${c.longitude})">
        <div class="ls-result-name">${c.name}</div>
        ${sub ? `<div class="ls-result-sub">${sub}</div>` : ''}
      </div>`;
    }).join('');
  } catch {
    results.innerHTML = '<div class="ls-msg">Search unavailable</div>';
  }
}

function selectCity(name, lat, lng) {
  loc = { lat, lng, city: name };
  usingDefault = false;
  viewDate = new Date(); viewDate.setHours(12,0,0,0);
  document.getElementById('locBanner').classList.remove('show');
  updateScrubBanner();
  render(lat, lng, name, viewDate);
  closeLocSheet();
  showToast('📍 ' + name);
}

// ─── Notifications ────────────────────────────────────────────────────
function updateBell() {
  const btn = document.getElementById('bellBtn');
  if (btn) btn.classList.toggle('bell-active', !!(reminder && reminder.enabled));
}

function openNotifSheet() {
  selectedDays = reminder ? reminder.daysBefore : 3;
  const nf = nextFullMoon();
  document.getElementById('nsNextFull').textContent =
    nf ? 'Next full moon: ' + fmtDateShort(nf) : '';
  document.querySelectorAll('.ns-preset').forEach(b =>
    b.classList.toggle('active', +b.dataset.days === selectedDays));
  const isActive = !!(reminder && reminder.enabled);
  const btn = document.getElementById('nsToggle');
  btn.textContent = isActive ? 'Cancel Reminder' : 'Enable Reminder';
  btn.classList.toggle('cancel', isActive);
  const overlay = document.getElementById('notifOverlay');
  overlay.style.display = 'flex';
  requestAnimationFrame(() => overlay.classList.add('open'));
}

function closeNotifSheet() {
  const overlay = document.getElementById('notifOverlay');
  overlay.classList.remove('open');
  setTimeout(() => { overlay.style.display = 'none'; }, 320);
}

function selectPreset(days) {
  selectedDays = days;
  document.querySelectorAll('.ns-preset').forEach(b =>
    b.classList.toggle('active', +b.dataset.days === days));
}

async function toggleReminder() {
  if (reminder && reminder.enabled) {
    reminder = null;
    localStorage.removeItem('moonReminder');
    localStorage.removeItem('moonNotifShown');
    updateBell();
    closeNotifSheet();
    showToast('Reminder cancelled');
    return;
  }
  if (!('Notification' in window)) {
    showToast('Notifications not supported on this device');
    return;
  }
  let perm = Notification.permission;
  if (perm === 'default') perm = await Notification.requestPermission();
  if (perm !== 'granted') {
    showToast('Allow notifications in browser settings');
    return;
  }
  const nf = nextFullMoon();
  reminder = { enabled: true, daysBefore: selectedDays, fullMoonDate: nf ? nf.toISOString() : null };
  localStorage.setItem('moonReminder', JSON.stringify(reminder));
  updateBell();
  closeNotifSheet();
  const label = selectedDays === 0 ? 'night of the full moon'
    : `${selectedDays} day${selectedDays > 1 ? 's' : ''} before`;
  showToast('Reminder set · ' + label);
}

function checkReminder() {
  if (!reminder || !reminder.enabled) return;
  if (Notification.permission !== 'granted') return;
  const nf = nextFullMoon();
  if (!nf) return;
  const today = new Date(); today.setHours(0,0,0,0);
  const nfDay = new Date(nf); nfDay.setHours(0,0,0,0);
  const daysUntil = Math.round((nfDay - today) / 86400000);
  if (daysUntil > reminder.daysBefore || daysUntil < 0) return;
  const todayStr = today.toISOString().split('T')[0];
  if (localStorage.getItem('moonNotifShown') === todayStr) return;
  const body = daysUntil === 0 ? 'Full moon tonight! 🌕'
    : `Full moon in ${daysUntil} day${daysUntil > 1 ? 's' : ''} 🌔`;
  new Notification('Moon Phase', { body, icon: './icons/icon-192.png' });
  localStorage.setItem('moonNotifShown', todayStr);
}

// ─── Render ───────────────────────────────────────────────────────────
function render(lat, lng, city, date) {
  const now = date ? new Date(date) : new Date();
  const moon  = SunCalc.getMoonIllumination(now);
  const times = SunCalc.getMoonTimes(now, lat, lng);
  const pos   = SunCalc.getMoonPosition(now, lat, lng);

  const {fraction:frac, phase, angle} = moon;
  const waxing  = angle < 0;
  const name    = getPhaseName(phase);
  const lDay    = Math.floor(phase * 29.53) + 1;
  const tiltDeg = angle * 180 / Math.PI;

  document.getElementById('dateMain').textContent = fmtDateLong(now);
  document.getElementById('dateSub').textContent  =
    now.toLocaleDateString([],{weekday:'long'}) + (city ? ' · ' + city : '');

  const shadow = document.getElementById('moonShadow');
  shadow.setAttribute('d', shadowPath(frac, waxing));
  shadow.setAttribute('transform', `rotate(${tiltDeg.toFixed(1)},120,120)`);

  document.getElementById('phaseName').textContent = name;
  const sign = getMoonSign(now);
  document.getElementById('phaseSub').innerHTML =
    `Phase ${phaseRoman(phase)} · <span class="ps-sign">${sign.symbol} ${sign.name}</span>`;

  const pIdx = Math.round(phase * 8) % 8;
  const dotsEl = document.getElementById('pdots');
  dotsEl.innerHTML = '';
  for (let i=0;i<8;i++){
    const d = document.createElement('div');
    d.className = 'pd' + (i===pIdx?' on':'');
    dotsEl.appendChild(d);
  }

  const rise = (times.alwaysUp||times.alwaysDown) ? null : times.rise;
  const set  = (times.alwaysUp||times.alwaysDown) ? null : times.set;

  document.getElementById('riseEl').textContent  = times.alwaysUp ? '∞' : fmtTime(rise);
  document.getElementById('setEl').textContent   = times.alwaysUp ? '∞' : fmtTime(set);
  document.getElementById('illumEl').textContent = fmtPct(frac);

  let up = false;
  if (times.alwaysUp)   up = true;
  else if (!times.alwaysDown) up = isAbove(rise, set);

  const dot = document.getElementById('hzDot');
  dot.className = 'hzdot ' + (up ? 'up' : 'dn');
  document.getElementById('hzText').textContent =
    times.alwaysUp   ? 'Moon is circumpolar — never sets here' :
    times.alwaysDown ? 'Moon does not rise today at this location' :
    up               ? 'Moon is above the horizon now' :
                       'Moon is below the horizon now';

  document.getElementById('lunarDayEl').textContent = `Day ${lDay} of 29`;
  document.getElementById('distEl').textContent     = fmtDistKm(pos.distance);

  const nf = nextFullMoon(now);
  const cdEl   = document.getElementById('countdown');
  const cdVal  = document.getElementById('cdValue');
  const cdDate = document.getElementById('cdDate');
  const cdLbl  = document.getElementById('cdLabel');
  cdEl.classList.remove('tonight');

  if (nf) {
    const today = new Date(now); today.setHours(0,0,0,0);
    const nfDay = new Date(nf); nfDay.setHours(0,0,0,0);
    const days  = Math.round((nfDay - today) / 86400000);

    if (!waxing && frac > 0.98) {
      const lf = lastFullMoon(now);
      if (lf) {
        const lfDay = new Date(lf); lfDay.setHours(0,0,0,0);
        const daysAgo = Math.round((today - lfDay) / 86400000);
        cdLbl.textContent  = 'Full moon';
        cdVal.textContent  = daysAgo <= 0 ? 'Tonight! 🌕'
                           : daysAgo === 1 ? 'Last night 🌕'
                           : `${daysAgo} nights ago 🌕`;
        cdDate.textContent = fmtDateShort(lf);
        cdEl.classList.add('tonight');
        buildMiniWindow(lf);
      }
    } else {
      cdLbl.textContent = 'Next full moon';
      if (days === 0) {
        cdVal.textContent  = 'Tonight! 🌕';
        cdDate.textContent = fmtDateShort(nf);
        cdEl.classList.add('tonight');
      } else if (days === 1) {
        cdVal.textContent  = 'Tomorrow';
        cdDate.textContent = fmtDateShort(nf);
      } else {
        cdVal.textContent  = `in ${days} days`;
        cdDate.textContent = fmtDateShort(nf);
      }
      buildMiniWindow(nf);
    }
  }

  const ld = document.getElementById('loading');
  if (ld) { ld.classList.add('fade'); setTimeout(()=>ld.remove(), 600); }
}

// ─── Geolocation ─────────────────────────────────────────────────────
async function tryIPFallback() {
  try {
    const r = await fetch('https://ipapi.co/json/');
    const d = await r.json();
    if (d.latitude) return {lat:d.latitude, lng:d.longitude, city:d.city};
  } catch {}
  return null;
}

async function requestLocation() {
  const btn = document.getElementById('locBtn');
  if (btn) btn.classList.add('loc-loading');

  const done = () => { if (btn) btn.classList.remove('loc-loading'); };

  if (!navigator.geolocation) { done(); useDefault(); return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      done();
      loc = {lat:pos.coords.latitude, lng:pos.coords.longitude, city:'Your Location'};
      usingDefault = false;
      viewDate = new Date(); viewDate.setHours(12,0,0,0);
      document.getElementById('locBanner').classList.remove('show');
      updateScrubBanner();
      render(loc.lat, loc.lng, loc.city, viewDate);
      showToast('📍 Location updated');
    },
    async () => {
      const ip = await tryIPFallback();
      done();
      if (ip) {
        loc = ip; usingDefault = false;
        viewDate = new Date(); viewDate.setHours(12,0,0,0);
        document.getElementById('locBanner').classList.remove('show');
        updateScrubBanner();
        render(loc.lat, loc.lng, loc.city, viewDate);
        showToast('📍 ' + (ip.city || 'Approximate location'));
      } else {
        useDefault();
      }
    },
    {timeout:5000, maximumAge:300000}
  );
}

function useDefault() {
  loc = DEFAULT; usingDefault = true;
  viewDate = new Date(); viewDate.setHours(12,0,0,0);
  document.getElementById('locBanner').classList.add('show');
  updateScrubBanner();
  render(loc.lat, loc.lng, loc.city, viewDate);
}

// ─── Month View ──────────────────────────────────────────────────────
let mvDate = new Date();

function renderMonth() {
  const y = mvDate.getFullYear(), m = mvDate.getMonth();
  const first = new Date(y, m, 1);
  const last  = new Date(y, m + 1, 0);
  const today = new Date(); today.setHours(0,0,0,0);

  document.getElementById('mvTitle').textContent =
    first.toLocaleDateString([], {month:'long', year:'numeric'});

  const now = new Date();
  const isCurrentMonth = (y === now.getFullYear() && m === now.getMonth());
  document.getElementById('mvTodayBtn').style.display = isCurrentMonth ? 'none' : 'inline';

  let startDow = first.getDay();
  const grid = document.getElementById('mvGrid');
  grid.innerHTML = '';

  for (let i = 0; i < startDow; i++) {
    const e = document.createElement('div');
    e.className = 'mvc';
    grid.appendChild(e);
  }

  for (let d = 1; d <= last.getDate(); d++) {
    const date = new Date(y, m, d, 12, 0, 0);
    const ill  = SunCalc.getMoonIllumination(date);
    const isToday = (date.getDate()===today.getDate() && date.getMonth()===today.getMonth() && date.getFullYear()===today.getFullYear());
    const isFull  = ill.fraction > 0.985;

    const cell = document.createElement('div');
    cell.className = 'mvc' + (isToday?' today':'') + (isFull?' full':'');
    cell.innerHTML =
      `<div class="mvc-num">${d}</div>` +
      `<div class="mvc-emoji">${moonEmoji(ill.phase)}</div>`;
    grid.appendChild(cell);
  }
}

function shiftMonth(delta) {
  mvDate = new Date(mvDate.getFullYear(), mvDate.getMonth() + delta, 1);
  renderMonth();
}

function goToToday() {
  mvDate = new Date();
  renderMonth();
}

// ─── Nav ─────────────────────────────────────────────────────────────
function createFlyingMoon(rect) {
  const el = document.createElement('div');
  el.className = 'flying-moon';
  el.style.left   = rect.left   + 'px';
  el.style.top    = rect.top    + 'px';
  el.style.width  = rect.width  + 'px';
  el.style.height = rect.height + 'px';
  document.body.appendChild(el);
  return el;
}

function setView(view, btn) {
  document.querySelectorAll('.nav-pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');

  const todayV = document.getElementById('todayView');
  const monthV = document.getElementById('monthView');

  if (view === 'month') {
    const heroRect = document.getElementById('moonSvg').getBoundingClientRect();
    const clone    = createFlyingMoon(heroRect);

    todayV.style.transition = 'opacity .24s ease';
    todayV.style.opacity    = '0';
    monthV.style.display    = 'block';
    monthV.style.opacity    = '0';
    renderMonth();

    const grid = document.getElementById('mvGrid');
    grid.classList.remove('mvg-enter');
    void grid.offsetWidth;
    grid.classList.add('mvg-enter');

    requestAnimationFrame(() => requestAnimationFrame(() => {
      const todayCell = monthV.querySelector('.mvc.today');
      let toRect;
      if (todayCell) {
        toRect = todayCell.getBoundingClientRect();
      } else {
        const g = grid.getBoundingClientRect();
        const s = heroRect.width * 0.28;
        toRect = { left: g.left + g.width/2 - s/2, top: g.top + g.height*0.25, width: s, height: s };
      }
      clone.style.transition = [
        'left .46s cubic-bezier(.34,1.1,.64,1)',
        'top .46s cubic-bezier(.34,1.1,.64,1)',
        'width .46s cubic-bezier(.34,1.1,.64,1)',
        'height .46s cubic-bezier(.34,1.1,.64,1)',
        'opacity .28s ease .18s'
      ].join(',');
      clone.style.left    = toRect.left   + 'px';
      clone.style.top     = toRect.top    + 'px';
      clone.style.width   = toRect.width  + 'px';
      clone.style.height  = toRect.height + 'px';
      clone.style.opacity = '0';
    }));

    setTimeout(() => {
      monthV.style.transition = 'opacity .3s ease';
      monthV.style.opacity    = '1';
      monthV.addEventListener('transitionend', () => monthV.style.transition = '', { once: true });
    }, 100);

    setTimeout(() => {
      todayV.style.display    = 'none';
      todayV.style.transition = '';
      todayV.style.opacity    = '';
      setTimeout(() => clone.remove(), 400);
    }, 240);
    setTimeout(() => grid.classList.remove('mvg-enter'), 650);

  } else if (view === 'today') {
    monthV.style.transition = 'opacity .24s ease';
    monthV.style.opacity    = '0';

    const staggerEls = ['phaseSection', 'countdown', 'cards']
      .map(id => document.getElementById(id)).filter(Boolean);

    staggerEls.forEach(el => { el.classList.remove('sr'); el.style.animationDelay = ''; });

    todayV.style.display   = '';
    todayV.style.opacity   = '0';
    todayV.style.transform = 'translateY(28px)';

    staggerEls.forEach((el, i) => {
      el.style.animationDelay = (0.21 + i * 0.055) + 's';
      el.classList.add('sr');
    });

    setTimeout(() => {
      todayV.style.transition = 'opacity .30s ease, transform .4s cubic-bezier(.25,.46,.45,.94)';
      todayV.style.opacity    = '1';
      todayV.style.transform  = 'translateY(0)';
      setTimeout(() => {
        todayV.style.transition = '';
        todayV.style.transform  = '';
        todayV.style.opacity    = '';
      }, 450);
    }, 130);

    setTimeout(() => {
      staggerEls.forEach(el => { el.classList.remove('sr'); el.style.animationDelay = ''; });
    }, 750);

    setTimeout(() => {
      monthV.style.display    = 'none';
      monthV.style.transition = '';
      monthV.style.opacity    = '';
    }, 560);
  }
}

function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = [
      'position:fixed;bottom:72px;left:50%;transform:translateX(-50%)',
      'background:rgba(30,30,50,.85);backdrop-filter:blur(14px)',
      'border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.85)',
      'font-family:\'Jost\',sans-serif;font-size:13px;letter-spacing:.04em',
      'padding:9px 20px;border-radius:999px;z-index:999;pointer-events:none',
      'transition:opacity .35s;white-space:nowrap'
    ].join(';');
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1800);
}

// ─── Date Scrub (swipe on moon + arrow buttons) ──────────────────────────
let swipeStart = null;
const moonSection = document.getElementById('moonSection');

function scrubDay(direction) {
  const moon = document.getElementById('moonSvg');
  moon.style.transition = 'transform .18s ease, opacity .15s ease';
  moon.style.transform  = `translateX(${direction * -140}px)`;
  moon.style.opacity    = '0';
  setTimeout(() => {
    viewDate = new Date(viewDate);
    viewDate.setDate(viewDate.getDate() + direction);
    viewDate.setHours(12,0,0,0);
    if (loc) render(loc.lat, loc.lng, loc.city, viewDate);
    updateScrubBanner();
    moon.style.transition = 'none';
    moon.style.transform  = `translateX(${direction * 140}px)`;
    moon.style.opacity    = '0';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      moon.style.transition = 'transform .28s cubic-bezier(.25,.46,.45,.94), opacity .22s ease';
      moon.style.transform  = 'translateX(0)';
      moon.style.opacity    = '1';
    }));
    setTimeout(() => {
      moon.style.transition = '';
      moon.style.transform  = '';
      moon.style.opacity    = '';
    }, 350);
  }, 180);
}

function isToday(date) {
  const t = new Date(); t.setHours(0,0,0,0);
  const d = new Date(date); d.setHours(0,0,0,0);
  return t.getTime() === d.getTime();
}

function updateScrubBanner() {
  const banner = document.getElementById('scrubBanner');
  const label  = document.getElementById('scrubDateLabel');
  if (isToday(viewDate)) {
    banner.classList.remove('show');
  } else {
    label.textContent = '📅 ' + fmtDateLong(viewDate);
    banner.classList.add('show');
  }
}

function resetToToday() {
  viewDate = new Date(); viewDate.setHours(12,0,0,0);
  updateScrubBanner();
  if (loc) render(loc.lat, loc.lng, loc.city, viewDate);
}

moonSection.addEventListener('touchstart', e => {
  swipeStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });

moonSection.addEventListener('touchmove', e => {
  if (!swipeStart) return;
  const dx = e.touches[0].clientX - swipeStart.x;
  const dy = e.touches[0].clientY - swipeStart.y;
  if (Math.abs(dx) > Math.abs(dy)) {
    const moon = document.getElementById('moonSvg');
    const shift = Math.max(-60, Math.min(60, dx * 0.35));
    moon.style.transform = `translateX(${shift}px)`;
  }
}, { passive: true });

moonSection.addEventListener('touchend', e => {
  if (!swipeStart) return;
  const dx = e.changedTouches[0].clientX - swipeStart.x;
  const moon = document.getElementById('moonSvg');

  if (Math.abs(dx) > 40) {
    scrubDay(dx < 0 ? 1 : -1);
  } else {
    moon.style.transition = 'transform .18s ease';
    moon.style.transform  = 'translateX(0)';
    setTimeout(() => { moon.style.transition = ''; moon.style.transform = ''; }, 200);
  }

  swipeStart = null;
}, { passive: true });

// ─── Refresh on tab focus ─────────────────────────────────────────────
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && loc) {
    viewDate = new Date(); viewDate.setHours(12,0,0,0);
    updateScrubBanner();
    render(loc.lat, loc.lng, loc.city, viewDate);
  }
});

// ─── Init ─────────────────────────────────────────────────────────────
navigator.geolocation ? requestLocation() : useDefault();
checkReminder();
updateBell();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
