<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Moon Phase</title>
<meta name="theme-color" content="#050810">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#E09DFF;
  --w80:rgba(255,255,255,.8);
  --w50:rgba(255,255,255,.5);
  --w20:rgba(255,255,255,.2);
  --w10:rgba(255,255,255,.1);
  --w06:rgba(255,255,255,.06);
}
html,body{height:100%;font-family:'Jost',system-ui,sans-serif;background:#050810;color:#fff;overflow-x:hidden}

/* ── Background ── */
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 80% 55% at 15% 8%, rgba(18,45,105,.65) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 88% 88%, rgba(55,18,105,.45) 0%,transparent 60%),
    radial-gradient(ellipse 100% 80% at 50% 45%, rgba(4,7,20,1) 0%,#050810 100%);
}
.stars{position:fixed;inset:0;z-index:1;pointer-events:none}
.stars::before{
  content:'';position:absolute;inset:0;
  background-image:
    radial-gradient(1px 1px at 7% 17%,#fff 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 21% 6%,#fff 0%,transparent 100%),
    radial-gradient(1px 1px at 37% 31%,rgba(255,255,255,.8) 0%,transparent 100%),
    radial-gradient(1px 1px at 51% 11%,rgba(255,255,255,.7) 0%,transparent 100%),
    radial-gradient(1px 1px at 66% 25%,#fff 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 81% 8%,rgba(255,255,255,.9) 0%,transparent 100%),
    radial-gradient(1px 1px at 12% 51%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 28% 67%,rgba(255,255,255,.8) 0%,transparent 100%),
    radial-gradient(1px 1px at 56% 57%,rgba(255,255,255,.6) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 72% 71%,rgba(255,255,255,.9) 0%,transparent 100%),
    radial-gradient(1px 1px at 88% 47%,rgba(255,255,255,.7) 0%,transparent 100%),
    radial-gradient(1px 1px at 3% 81%,rgba(255,255,255,.8) 0%,transparent 100%),
    radial-gradient(1px 1px at 42% 87%,rgba(255,255,255,.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 92% 87%,rgba(255,255,255,.7) 0%,transparent 100%),
    radial-gradient(1px 1px at 32% 42%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 61% 38%,rgba(200,180,255,.6) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 77% 32%,#fff 0%,transparent 100%),
    radial-gradient(1px 1px at 16% 26%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 46% 2%,rgba(255,255,255,.7) 0%,transparent 100%),
    radial-gradient(1px 1px at 85% 61%,rgba(255,255,255,.7) 0%,transparent 100%),
    radial-gradient(1px 1px at 1% 44%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 54% 77%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 95% 21%,rgba(255,255,255,.8) 0%,transparent 100%),
    radial-gradient(1px 1px at 70% 14%,rgba(210,200,255,.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 23% 91%,rgba(255,255,255,.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 48% 58%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 9% 33%,rgba(255,255,255,.6) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 63% 5%,rgba(255,255,255,.7) 0%,transparent 100%),
    radial-gradient(1px 1px at 35% 78%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 79% 52%,rgba(255,255,255,.6) 0%,transparent 100%);
}
.stars::after{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 45% 25% at 10% 20%,rgba(28,65,140,.2) 0%,transparent 70%),
    radial-gradient(ellipse 35% 35% at 90% 75%,rgba(85,28,145,.15) 0%,transparent 70%),
    radial-gradient(ellipse 55% 15% at 50% 92%,rgba(18,45,125,.12) 0%,transparent 70%);
}

/* ── App ── */
#app{
  position:relative;z-index:10;
  width:min(390px,100vw);min-height:100dvh;
  margin:0 auto;display:flex;flex-direction:column;
  padding-bottom:36px;
}

/* ── Loading ── */
#loading{
  position:fixed;inset:0;z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  background:#050810;transition:opacity .5s ease;
}
#loading.fade{opacity:0;pointer-events:none}
.ld-moon{
  width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#D8D4CC,#8A8680,#3A3630);
  animation:ldpulse 1.6s ease-in-out infinite;
}
@keyframes ldpulse{0%,100%{opacity:.35;transform:scale(.88)}50%{opacity:1;transform:scale(1)}}
.ld-text{font-size:14px;color:var(--w50);letter-spacing:.08em}

/* ── Status bar ── */
#statusBar{display:none}

/* ── Topbar ── */
#topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 22px 0;
}
.top-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--w80);cursor:pointer;border-radius:50%;background:transparent;border:none}
.nav-pills{
  display:flex;background:rgba(255,255,255,.08);
  border:1px solid var(--w10);border-radius:999px;
  padding:3px;gap:1px;backdrop-filter:blur(12px);
}
.nav-pill{
  font-family:'Jost',sans-serif;font-size:14px;font-weight:500;
  padding:5px 18px;border-radius:999px;cursor:pointer;
  color:var(--w50);border:none;background:none;transition:all .2s;letter-spacing:.02em;
}
.nav-pill.active{background:#fff;color:#000}
.nav-pill.soon{opacity:.45;cursor:default}

/* ── Location banner ── */
#locBanner{
  display:none;margin:8px 22px 0;padding:8px 14px;
  background:rgba(224,157,255,.08);border:1px solid rgba(224,157,255,.2);
  border-radius:10px;font-size:12px;color:var(--accent);
  letter-spacing:.02em;cursor:pointer;text-align:center;
  transition:opacity .3s;
}
#locBanner.show{display:block}

/* ── Date ── */
#dateSection{text-align:center;padding:16px 22px 0}
#dateMain{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1}
#dateSub{font-size:14px;font-weight:400;color:var(--w50);margin-top:3px;letter-spacing:.04em}

/* ── Moon ── */
#moonSection{
  position:relative;display:flex;align-items:center;justify-content:center;
  padding:14px 0 6px;flex-shrink:0;
}
.orbit{position:absolute;border-radius:50%;border:1px dashed rgba(255,255,255,.14);pointer-events:none}
.orb1{width:298px;height:298px}
.orb2{width:360px;height:360px;border-color:rgba(255,255,255,.07)}
.planet{position:absolute;font-size:17px;opacity:.7;user-select:none}
.pl-tl{top:46px;left:calc(50% - 82px)}
.pl-br{bottom:46px;right:calc(50% - 82px)}
#moonSvg{
  filter:
    drop-shadow(0 0 28px rgba(210,200,190,.2))
    drop-shadow(0 0 60px rgba(210,200,190,.09));
  position:relative;z-index:5;
}

/* ── Phase text ── */
#phaseSection{text-align:center;padding:10px 22px 0}
#phaseName{font-size:24px;font-weight:700;letter-spacing:.01em}
#phaseSub{font-size:13px;color:var(--w50);margin-top:4px;letter-spacing:.06em}
.pdots{display:flex;justify-content:center;gap:7px;margin-top:10px}
.pd{width:7px;height:7px;border-radius:50%;background:var(--w20);transition:background .3s}
.pd.on{background:var(--w80)}

/* ── Countdown ── */
#countdown{
  margin:14px 16px 0;
  padding:13px 20px;
  background:rgba(224,157,255,.09);
  border:1px solid rgba(224,157,255,.2);
  border-radius:16px;
  display:flex;flex-direction:column;
  backdrop-filter:blur(12px);
}
#countdown.tonight{
  background:rgba(224,157,255,.16);
  border-color:rgba(224,157,255,.4);
}
.cd-row{display:flex;align-items:center;justify-content:space-between}
.cd-label{font-size:12px;color:var(--w50);text-transform:uppercase;letter-spacing:.1em}
.cd-value{font-size:22px;font-weight:700;color:var(--accent);letter-spacing:.01em;line-height:1.15}
.cd-date{font-size:12px;color:var(--w50);margin-top:2px;letter-spacing:.04em}
.cd-icon{font-size:24px;opacity:.8}

/* ── Mini Full Moon Window ── */
.mw-strip{
  display:flex;justify-content:space-between;
  margin-top:12px;padding-top:11px;
  border-top:1px solid rgba(255,255,255,.1);
}
.mw-day{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.mw-date{font-size:11px;color:var(--w50);letter-spacing:.03em}
.mw-icon{font-size:20px;line-height:1.2}
.mw-pct{font-size:11px;color:var(--w50)}
.mw-day.peak .mw-date{color:var(--accent);font-weight:600}
.mw-day.peak .mw-icon{font-size:26px}
.mw-day.peak .mw-pct{color:var(--accent);font-weight:600}
.mw-day.today .mw-date{color:#fff;font-weight:600}

/* ── Cards ── */
#cards{padding:10px 16px 0;display:flex;flex-direction:column;gap:10px}
.card{
  background:rgba(255,255,255,.07);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.11);border-radius:20px;padding:16px 20px;
}

/* Times card */
.times-card{display:flex;justify-content:space-around;align-items:center}
.tc{text-align:center;flex:1}
.tc-lbl{font-size:11px;color:var(--w50);text-transform:uppercase;letter-spacing:.12em;margin-bottom:5px}
.tc-val{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tc-val.ac{color:var(--accent)}
.tc-val.wh{color:rgba(255,255,255,.85);font-size:22px}
.tc-sep{width:1px;height:36px;background:var(--w10)}

/* Horizon card */
.hz-row{display:flex;align-items:center;justify-content:center;gap:8px}
.hzdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.hzdot.up{background:#4ABFB0;animation:blink 2.4s ease-in-out infinite}
.hzdot.dn{background:#B06060}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hztext{font-size:13px;color:var(--w80);letter-spacing:.02em}

/* Info card */
.ir{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--w06)}
.ir:first-child{padding-top:0}
.ir:last-child{border-bottom:none;padding-bottom:0}
.ilbl{font-size:11px;color:var(--w50);text-transform:uppercase;letter-spacing:.1em}
.ival{font-size:14px;font-weight:500}
.ival.ac{color:var(--accent)}

</style>
</head>
<body>

<div class="stars"></div>

<!-- Loading -->
<div id="loading">
  <div class="ld-moon"></div>
  <div class="ld-text">reading the moon</div>
</div>

<div id="app">

  <div id="statusBar"></div>

  <!-- Nav -->
  <div id="topbar">
    <button class="top-icon" onclick="requestLocation()" title="Refresh location">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
        <circle cx="12" cy="9" r="2.5"/>
      </svg>
    </button>
    <div class="nav-pills">
      <button class="nav-pill active" onclick="setView('today',this)">Today</button>
      <button class="nav-pill soon" onclick="showToast('Coming soon 🌙')">Week</button>
      <button class="nav-pill soon" onclick="showToast('Coming soon 🌙')">Month</button>
    </div>
    <button class="top-icon" title="Refresh" onclick="if(loc) render(loc.lat, loc.lng, loc.city)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
    </button>
  </div>

  <!-- Location banner -->
  <div id="locBanner" onclick="requestLocation()">
    📍 Using default location · Tap to use yours
  </div>

  <!-- Date -->
  <div id="dateSection">
    <div id="dateMain">—</div>
    <div id="dateSub">—</div>
  </div>

  <!-- Moon SVG -->
  <div id="moonSection">
    <div class="orbit orb2"></div>
    <div class="orbit orb1"></div>
    <div class="planet pl-tl">♄</div>
    <div class="planet pl-br">🪐</div>

    <svg id="moonSvg" width="220" height="220" viewBox="0 0 240 240">
      <defs>
        <clipPath id="mc"><circle cx="120" cy="120" r="115"/></clipPath>
      </defs>
      <!-- Actual moon photo (Wikipedia Commons / NASA, public domain) -->
      <image id="moonImg"
        href="./moon.jpg"
        x="0" y="0" width="240" height="240"
        clip-path="url(#mc)"
        preserveAspectRatio="xMidYMid slice"/>
      <!-- Phase shadow: updated by JS -->
      <path id="moonShadow" d="" fill="rgba(3,5,14,.94)" clip-path="url(#mc)"/>
      <!-- Rim -->
      <circle cx="120" cy="120" r="115" fill="none" stroke="rgba(255,255,255,.055)" stroke-width="1.5"/>
    </svg>
  </div>

  <!-- Phase info -->
  <div id="phaseSection">
    <div id="phaseName">—</div>
    <div id="phaseSub">—</div>
    <div class="pdots" id="pdots"></div>
  </div>

  <!-- Countdown + Mini Window -->
  <div id="countdown">
    <div class="cd-row">
      <div>
        <div class="cd-label">Next full moon</div>
        <div class="cd-value" id="cdValue">—</div>
        <div class="cd-date" id="cdDate"></div>
      </div>
      <div class="cd-icon">🌕</div>
    </div>
    <div class="mw-strip" id="mwStrip"></div>
  </div>

  <!-- Cards -->
  <div id="cards">

    <!-- Rise / Illuminated / Set -->
    <div class="card times-card">
      <div class="tc">
        <div class="tc-lbl">Moonrise</div>
        <div class="tc-val ac" id="riseEl">—</div>
      </div>
      <div class="tc-sep"></div>
      <div class="tc">
        <div class="tc-lbl">Illuminated</div>
        <div class="tc-val wh" id="illumEl">—</div>
      </div>
      <div class="tc-sep"></div>
      <div class="tc">
        <div class="tc-lbl">Moonset</div>
        <div class="tc-val ac" id="setEl">—</div>
      </div>
    </div>

    <!-- Horizon status -->
    <div class="card" style="padding:12px 20px">
      <div class="hz-row">
        <div class="hzdot" id="hzDot"></div>
        <span class="hztext" id="hzText">—</span>
      </div>
    </div>

    <!-- Info rows -->
    <div class="card">
      <div class="ir">
        <span class="ilbl">Lunar day</span>
        <span class="ival" id="lunarDayEl">—</span>
      </div>
      <div class="ir">
        <span class="ilbl">Distance</span>
        <span class="ival" id="distEl">—</span>
      </div>
    </div>

  </div>
</div>

<script>
// ─── Constants ────────────────────────────────────────────────────────
const DEFAULT = {lat:32.0853, lng:34.7818, city:'Tel Aviv'};

const PHASE_INFO = {
  'New Moon':        'The cycle begins anew. A powerful moment for intention-setting, new starts, and quiet reflection.',
  'Waxing Crescent': 'The moon grows stronger. Energy builds — a good time to nurture plans and plant seeds of intention.',
  'First Quarter':   'A turning point in the cycle. Push through resistance and take decisive steps toward your goals.',
  'Waxing Gibbous':  'Almost there. Refine and perfect what you have started — full moon and peak energy approach.',
  'Full Moon':       'Peak energy and illumination. Emotions run high, creativity peaks, insights arrive with clarity.',
  'Waning Gibbous':  'Share what you have gained. A time for gratitude, generosity, and passing wisdom forward.',
  'Last Quarter':    'Release what no longer serves you. Let go, forgive, and clear space for what comes next.',
  'Waning Crescent': 'Rest and restore. The cycle nears its end — surrender, reflect, and prepare for renewal.',
};

let loc = null, usingDefault = false;

// ─── Helpers ──────────────────────────────────────────────────────────
function getPhaseName(p) {
  if (p < .0625 || p >= .9375) return 'New Moon';
  if (p < .1875) return 'Waxing Crescent';
  if (p < .3125) return 'First Quarter';
  if (p < .4375) return 'Waxing Gibbous';
  if (p < .5625) return 'Full Moon';
  if (p < .6875) return 'Waning Gibbous';
  if (p < .8125) return 'Last Quarter';
  return 'Waning Crescent';
}

function phaseRoman(p) {
  return ['I','II','III','IV','V','VI','VII','VIII'][Math.round(p * 8) % 8];
}

// SVG shadow path for accurate phase shape
function shadowPath(frac, waxing) {
  const R=115, cx=120, cy=120;
  if (frac >= .999) return '';
  if (frac <= .001) return `M${cx-R} ${cy} A${R} ${R} 0 1 0 ${cx+R} ${cy} A${R} ${R} 0 1 0 ${cx-R} ${cy}Z`;
  const tx = R * Math.abs(1 - 2*frac);
  if (waxing) {
    if (frac < .5) return `M${cx} ${cy-R} A${R} ${R} 0 0 0 ${cx} ${cy+R} A${tx} ${R} 0 0 0 ${cx} ${cy-R}Z`;
    else          return `M${cx} ${cy-R} A${R} ${R} 0 0 0 ${cx} ${cy+R} A${tx} ${R} 0 0 1 ${cx} ${cy-R}Z`;
  } else {
    if (frac > .5) return `M${cx} ${cy-R} A${R} ${R} 0 0 1 ${cx} ${cy+R} A${tx} ${R} 0 0 0 ${cx} ${cy-R}Z`;
    else           return `M${cx} ${cy-R} A${R} ${R} 0 0 1 ${cx} ${cy+R} A${tx} ${R} 0 0 1 ${cx} ${cy-R}Z`;
  }
}

function fmtTime(d) {
  if (!d || isNaN(+d)) return 'N/A';
  return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
}

function fmtPct(f) {
  const p = f * 100;
  if (p < .1) return '0%';
  if (p > 99.9) return '100%';
  return p.toFixed(1) + '%';
}

function fmtDistKm(km) {
  return Math.round(km).toLocaleString() + ' km';
}

function fmtDateLong(d) {
  return d.toLocaleDateString([],{month:'long',day:'numeric',year:'numeric'});
}
function fmtDateShort(d) {
  return d.toLocaleDateString([],{month:'short',day:'numeric'});
}

// Is moon above the horizon right now?
function isAbove(rise, set) {
  const now = Date.now();
  if (!rise && !set) return false;
  if (!rise) return now < +set;
  if (!set)  return now > +rise;
  if (+rise < +set) return now >= +rise && now < +set;
  return now < +set || now >= +rise;   // moonrise after moonset (crosses midnight)
}

// Moon phase emoji
function moonEmoji(phase) {
  if (phase < 0.0625 || phase >= 0.9375) return '🌑';
  if (phase < 0.1875) return '🌒';
  if (phase < 0.3125) return '🌓';
  if (phase < 0.4375) return '🌔';
  if (phase < 0.5625) return '🌕';
  if (phase < 0.6875) return '🌖';
  if (phase < 0.8125) return '🌗';
  return '🌘';
}

// Build 5-day strip around next full moon
function buildMiniWindow(nf) {
  const strip = document.getElementById('mwStrip');
  if (!strip || !nf) return;
  strip.innerHTML = '';
  const today = new Date(); today.setHours(0,0,0,0);
  for (let i = -2; i <= 2; i++) {
    const d = new Date(nf);
    d.setDate(nf.getDate() + i);
    d.setHours(12,0,0,0);
    const ill = SunCalc.getMoonIllumination(d);
    const isPeak  = (i === 0);
    const isToday = (d.getTime() === today.getTime());
    const div = document.createElement('div');
    div.className = 'mw-day' + (isPeak ? ' peak' : '') + (isToday ? ' today' : '');
    div.innerHTML =
      `<div class="mw-date">${d.toLocaleDateString([],{day:'numeric',month:'short'})}</div>` +
      `<div class="mw-icon">${moonEmoji(ill.phase)}</div>` +
      `<div class="mw-pct">${Math.round(ill.fraction*100)}%</div>`;
    strip.appendChild(div);
  }
}

// Find next full moon by iterating days
function nextFullMoon() {
  const base = new Date(); base.setHours(12,0,0,0);
  let prev = SunCalc.getMoonIllumination(base).fraction;
  for (let i=1; i<=35; i++) {
    const d = new Date(base); d.setDate(base.getDate()+i);
    const f = SunCalc.getMoonIllumination(d).fraction;
    if (prev > f && prev > .993) {
      const peak = new Date(base); peak.setDate(base.getDate()+i-1);
      return peak;
    }
    prev = f;
  }
  return null;
}


// ─── Render ───────────────────────────────────────────────────────────
function render(lat, lng, city) {
  const now = new Date();
  const moon  = SunCalc.getMoonIllumination(now);
  const times = SunCalc.getMoonTimes(now, lat, lng);
  const pos   = SunCalc.getMoonPosition(now, lat, lng);

  const {fraction:frac, phase, angle} = moon;
  const waxing  = angle < 0;
  const name    = getPhaseName(phase);
  const lDay    = Math.floor(phase * 29.53) + 1;
  const tiltDeg = angle * 180 / Math.PI;

  // Date
  document.getElementById('dateMain').textContent = fmtDateLong(now);
  document.getElementById('dateSub').textContent  =
    now.toLocaleDateString([],{weekday:'long'}) + (city ? ' · ' + city : '');

  // Moon SVG
  const shadow = document.getElementById('moonShadow');
  shadow.setAttribute('d', shadowPath(frac, waxing));
  shadow.setAttribute('transform', `rotate(${tiltDeg.toFixed(1)},120,120)`);

  // Phase text
  document.getElementById('phaseName').textContent = name;
  document.getElementById('phaseSub').textContent  = `Phase ${phaseRoman(phase)}`;

  // Phase dots (8 phases)
  const pIdx = Math.round(phase * 8) % 8;
  const dotsEl = document.getElementById('pdots');
  dotsEl.innerHTML = '';
  for (let i=0;i<8;i++){
    const d = document.createElement('div');
    d.className = 'pd' + (i===pIdx?' on':'');
    dotsEl.appendChild(d);
  }

  // Rise / Set
  const rise = (times.alwaysUp||times.alwaysDown) ? null : times.rise;
  const set  = (times.alwaysUp||times.alwaysDown) ? null : times.set;

  document.getElementById('riseEl').textContent  = times.alwaysUp ? '∞' : fmtTime(rise);
  document.getElementById('setEl').textContent   = times.alwaysUp ? '∞' : fmtTime(set);
  document.getElementById('illumEl').textContent = fmtPct(frac);

  // Horizon
  let up = false;
  if (times.alwaysUp)   up = true;
  else if (!times.alwaysDown) up = isAbove(rise, set);

  const dot = document.getElementById('hzDot');
  dot.className = 'hzdot ' + (up ? 'up' : 'dn');
  document.getElementById('hzText').textContent =
    times.alwaysUp   ? 'Moon is circumpolar — never sets here' :
    times.alwaysDown ? 'Moon does not rise today at this location' :
    up               ? 'Moon is above the horizon now' :
                       'Moon is below the horizon now';

  // Info rows
  document.getElementById('lunarDayEl').textContent = `Day ${lDay} of 29`;
  document.getElementById('distEl').textContent     = fmtDistKm(pos.distance);

  // Countdown
  const nf = nextFullMoon();
  const cdEl  = document.getElementById('countdown');
  const cdVal  = document.getElementById('cdValue');
  const cdDate = document.getElementById('cdDate');
  if (nf) {
    const today = new Date(); today.setHours(0,0,0,0);
    const nfDay = new Date(nf); nfDay.setHours(0,0,0,0);
    const days  = Math.round((nfDay - today) / 86400000);
    if (days === 0) {
      cdVal.textContent  = 'Tonight! 🌕';
      cdDate.textContent = fmtDateShort(nf);
      cdEl.classList.add('tonight');
    } else if (days === 1) {
      cdVal.textContent  = 'Tomorrow';
      cdDate.textContent = fmtDateShort(nf);
    } else {
      cdVal.textContent  = `in ${days} days`;
      cdDate.textContent = fmtDateShort(nf);
    }
    buildMiniWindow(nf);
  }

  // Hide loading
  const ld = document.getElementById('loading');
  if (ld) { ld.classList.add('fade'); setTimeout(()=>ld.remove(), 600); }
}

// ─── Geolocation ─────────────────────────────────────────────────────
async function tryIPFallback() {
  try {
    const r = await fetch('https://ipapi.co/json/');
    const d = await r.json();
    if (d.latitude) return {lat:d.latitude, lng:d.longitude, city:d.city};
  } catch {}
  return null;
}

async function requestLocation() {
  if (!navigator.geolocation) { useDefault(); return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      loc = {lat:pos.coords.latitude, lng:pos.coords.longitude, city:'Your Location'};
      usingDefault = false;
      document.getElementById('locBanner').classList.remove('show');
      render(loc.lat, loc.lng, loc.city);
    },
    async () => {
      const ip = await tryIPFallback();
      if (ip) {
        loc = ip; usingDefault = false;
        document.getElementById('locBanner').classList.remove('show');
      } else {
        useDefault(); return;
      }
      render(loc.lat, loc.lng, loc.city);
    },
    {timeout:5000, maximumAge:300000}
  );
}

function useDefault() {
  loc = DEFAULT; usingDefault = true;
  document.getElementById('locBanner').classList.add('show');
  render(loc.lat, loc.lng, loc.city);
}

// ─── Nav ─────────────────────────────────────────────────────────────
function setView(view, btn) {
  document.querySelectorAll('.nav-pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
}

function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = [
      'position:fixed;bottom:72px;left:50%;transform:translateX(-50%)',
      'background:rgba(30,30,50,.85);backdrop-filter:blur(14px)',
      'border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.85)',
      'font-family:\'Jost\',sans-serif;font-size:13px;letter-spacing:.04em',
      'padding:9px 20px;border-radius:999px;z-index:999;pointer-events:none',
      'transition:opacity .35s;white-space:nowrap'
    ].join(';');
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1800);
}

// ─── Refresh on tab focus ─────────────────────────────────────────────
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && loc) render(loc.lat, loc.lng, loc.city);
});

// ─── Init ─────────────────────────────────────────────────────────────
navigator.geolocation ? requestLocation() : useDefault();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
